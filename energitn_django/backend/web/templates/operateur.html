{{ data|json_script:"energitn-data" }}

<script>
/* =========================================================
   1. DONNEES DJANGO
========================================================= */

const dataElement = document.getElementById("energitn-data");

const $ = id => document.getElementById(id);

if (!dataElement) {
    throw new Error("Données Django introuvables.");
}

let D;

try {
    D = JSON.parse(dataElement.textContent);
} catch (error) {
    console.error("Erreur JSON Django :", error);
    throw new Error("Impossible de lire les données énergétiques.");
}

const R = Array.isArray(D.regions) ? D.regions : [];
const DATES = Array.isArray(D.dates) ? D.dates : [];

/* =========================================================
   2. PARAMETRES ENERGETIQUES
========================================================= */

const SH = [
    .72,.68,.66,.65,.67,.74,.85,.95,
    .98,.95,.92,.93,.97,.96,.92,.9,
    .95,1.05,1.18,1.25,1.22,1.1,.92,.8
];

const SHM = SH.reduce((a,b)=>a+b,0)/24;

const RED = .92;
const AMB = .80;

/* =========================================================
   3. COORDONNEES DES SIX REGIONS
========================================================= */

const GEO = {
    tun:[36.8065,10.1815],
    biz:[37.2744,9.8739],
    sou:[35.8256,10.63699],
    sfx:[34.7406,10.7603],
    gab:[33.8815,10.0982],
    toz:[33.9197,8.1335]
};

/* =========================================================
   4. CORRESPONDANCE GOUVERNORATS / REGIONS
========================================================= */

/*
   Attention :
   cette correspondance est indicative.
   Les six régions modélisées ne représentent pas
   nécessairement six gouvernorats entiers.
*/

const GOVERNORATE_TO_REGION = {
    "TN-11":"tun",
    "TN-23":"biz",
    "TN-51":"sou",
    "TN-61":"sfx",
    "TN-81":"gab",
    "TN-72":"toz"
};

const GOVERNORATE_NAME_TO_REGION = {
    "tunis":"tun",
    "bizerte":"biz",
    "sousse":"sou",
    "sfax":"sfx",
    "gabes":"gab",
    "tozeur":"toz"
};

/* =========================================================
   5. ETAT DE L'INTERFACE
========================================================= */

let lang = "fr";

let day = 0;
let hour = 20;
let heat = 0;
let sel = "gab";
let timer = null;

try {
    lang = localStorage.getItem("lang") || "fr";
} catch(e) {
    lang = "fr";
}

if (!["fr","ar"].includes(lang)) {
    lang = "fr";
}

/* =========================================================
   6. VARIABLES DE LA CARTE
========================================================= */

let energyMap = null;
let governorateLayer = null;
let regionMarkerLayer = null;

let currentMapRegions = [];
let geojsonLoaded = false;

/* =========================================================
   7. TRADUCTIONS
========================================================= */

const T = {

fr:{

    role:"Vue opérateur · analyste énergétique",

    l_day:"Jour",

    l_hour:"Heure : ",

    l_heat:"Scénario de chaleur : ",

    play:"▶ Lecture",

    pause:"❚❚ Pause",

    h_map:"Carte énergétique interactive de la Tunisie",

    h_rank:"Taux de charge par région",

    h_al:"Alertes",

    h_heat:"Carte de chaleur sur 24 h : région × heure",

    h_det:"Détail de la région",

    h_an:"Anomalies récurrentes (30 derniers jours)",

    k1:"Demande nationale",

    k2:"Marge disponible",

    k3:"Zones rouges",

    k4:"Heures rouges prévues ce jour",

    mw:"MW",

    ok:"Normal",

    w:"Vigilance",

    b:"Critique",

    al_b:"%r : charge à %p % de la capacité. Risque de coupure : préparer un report de charge.",

    al_w:"%r : charge à %p %, à surveiller.",

    noal:"Aucune alerte : toutes les régions sont sous le seuil de vigilance.",

    peak:"Pic prévu",

    hrs:"heures au-dessus du seuil critique",

    cap:"Capacité",

    temp:"Température",

    seuil:"Seuil critique",

    th:["Région","Anomalies","Type dominant"],

    map_hint:"Les polygones représentent les gouvernorats. Les cercles représentent les six zones modélisées. Les polygones sans données propres restent en gris.",

    loc:"fr-FR"

},

ar:{

    role:"واجهة المشغّل · محلل الطاقة",

    l_day:"اليوم",

    l_hour:"الساعة: ",

    l_heat:"سيناريو الحرارة: ",

    play:"▶ تشغيل",

    pause:"❚❚ إيقاف",

    h_map:"الخريطة الطاقية التفاعلية لتونس",

    h_rank:"نسبة الحمل حسب المنطقة",

    h_al:"التنبيهات",

    h_heat:"خريطة حرارية على 24 ساعة",

    h_det:"تفاصيل المنطقة",

    h_an:"الشذوذات المتكررة",

    k1:"الطلب الوطني",

    k2:"الهامش المتاح",

    k3:"المناطق الحرجة",

    k4:"الساعات الحرجة المتوقعة",

    mw:"م.و",

    ok:"عادي",

    w:"يقظة",

    b:"حرج",

    al_b:"%r: الحمل %p % من الطاقة.",

    al_w:"%r: الحمل %p %، تحت المراقبة.",

    noal:"لا توجد تنبيهات.",

    peak:"الذروة المتوقعة",

    hrs:"ساعات فوق العتبة الحرجة",

    cap:"الطاقة",

    temp:"الحرارة",

    seuil:"العتبة الحرجة",

    th:["المنطقة","الشذوذات","النوع الغالب"],

    map_hint:"تمثل الأشكال المحافظات والدوائر المناطق الست للنموذج. المناطق غير المتوفرة تظهر باللون الرمادي.",

    loc:"ar-TN-u-nu-latn"

}

};

const t = () => T[lang];

/* =========================================================
   8. OUTILS
========================================================= */

function nm(value) {
    const number = Number(value);

    if (!Number.isFinite(number)) {
        return "N/D";
    }

    return number.toLocaleString(
        t().loc,
        {maximumFractionDigits:0}
    );
}

function safeNumber(value) {
    const number = Number(value);

    return Number.isFinite(number) ? number : null;
}

function col(u) {

    if (u === null || !Number.isFinite(u)) {
        return "#aebbc0";
    }

    if (u >= RED) return "var(--bad)";
    if (u >= AMB) return "var(--warn)";

    return "var(--ok)";
}

function getUsageColor(usage) {

    if (usage === null || !Number.isFinite(usage)) {
        return "#aebbc0";
    }

    if (usage >= RED) return "#dc443d";
    if (usage >= AMB) return "#e9a323";

    return "#16a36a";
}

function st(u) {

    if (u === null || !Number.isFinite(u)) {
        return "unknown";
    }

    return u >= RED ? "b" : u >= AMB ? "w" : "ok";
}

function getUsageStatus(usage) {

    if (usage === null || !Number.isFinite(usage)) {
        return lang === "fr"
            ? "Données indisponibles"
            : "بيانات غير متوفرة";
    }

    if (usage >= RED) return t().b;
    if (usage >= AMB) return t().w;

    return t().ok;
}

function formatUsage(usage) {

    if (usage === null || !Number.isFinite(usage)) {
        return "N/D";
    }

    return Math.round(usage*100)+" %";
}

function escapeMapText(value) {

    return String(value ?? "").replace(/[&<>"']/g,char=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
    })[char]);
}

/* =========================================================
   9. CALCULS ENERGETIQUES
========================================================= */

function util(r,d,h) {

    if (!Array.isArray(r.util)) {
        return null;
    }

    const base = safeNumber(r.util[d]);

    if (base === null) {
        return null;
    }

    const variation = safeNumber(r.s) ?? 0;

    const result = base * SH[h] / SHM *
        (1 + variation * heat / 20);

    return Number.isFinite(result) ? result : null;
}

function temp(r,d,h) {

    const max = Array.isArray(r.tmax)
        ? safeNumber(r.tmax[d])
        : null;

    if (max === null) {
        return null;
    }

    return max - 3 + heat +
        3 * Math.sin((h-9)/24*2*Math.PI);
}

function dateOf(d) {
    return new Date(DATES[d]+"T12:00:00");
}

/* =========================================================
   10. OUTILS GEOJSON
========================================================= */

function normalizeName(value) {

    return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .toLowerCase()
        .trim();
}

function getGovernorateCode(feature) {

    const p = feature.properties || {};

    return String(
        p.id ||
        p.iso ||
        p.iso_3166_2 ||
        p.code ||
        feature.id ||
        ""
    ).toUpperCase();
}

function getGovernorateName(feature) {

    const p = feature.properties || {};

    return (
        p.name_fr ||
        p.name ||
        p.name_en ||
        p.name_ar ||
        p.NAME_1 ||
        p.NAME ||
        "Gouvernorat"
    );
}

function getRegionId(feature) {

    const code = getGovernorateCode(feature);

    if (GOVERNORATE_TO_REGION[code]) {
        return GOVERNORATE_TO_REGION[code];
    }

    const p = feature.properties || {};

    const name =
        p.name_fr ||
        p.name ||
        p.name_en ||
        p.name_ar ||
        p.NAME_1 ||
        p.NAME ||
        "";

    return GOVERNORATE_NAME_TO_REGION[
        normalizeName(name)
    ] || null;
}

function getRegionData(regionId) {

    return currentMapRegions.find(
        item => item.r.id === regionId
    ) || null;
}

/* =========================================================
   11. INITIALISATION LEAFLET
========================================================= */

function initEnergyMap() {

    if (
        typeof window.L === "undefined" ||
        typeof window.L.map !== "function"
    ) {
        console.error("Leaflet n'est pas chargé.");

        $("map_status").textContent =
            "Erreur : Leaflet est indisponible.";

        return;
    }

    if (energyMap) {
        energyMap.invalidateSize();
        return;
    }

    energyMap = window.L.map("map", {
        scrollWheelZoom:true
    }).setView([34.0,9.5],6);

    window.L.tileLayer(
        "https://tile.openstreetmap.de/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:
                '&copy; OpenStreetMap contributors | Tiles: openstreetmap.de'
        }
    ).addTo(energyMap);

    governorateLayer = window.L.geoJSON(null, {
        style:styleGovernorate,
        onEachFeature:onEachGovernorate
    }).addTo(energyMap);

    regionMarkerLayer = window.L.layerGroup().addTo(energyMap);

    loadGovernorates();

    setTimeout(() => {
        energyMap.invalidateSize();
    },300);
}

/* =========================================================
   12. CHARGEMENT GEOJSON
========================================================= */

async function loadGovernorates() {

    const url = "{% static 'web/geo/tunisia-governorates-medium.geojson' %}";

    try {

        $("map_status").textContent =
            lang === "fr"
            ? "Chargement des gouvernorats..."
            : "جاري تحميل المحافظات...";

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const geojson = await response.json();

        if (
            !geojson.features ||
            !Array.isArray(geojson.features)
        ) {
            throw new Error("Format GeoJSON invalide.");
        }

        governorateLayer.clearLayers();
        governorateLayer.addData(geojson);

        geojsonLoaded = true;

        const bounds = governorateLayer.getBounds();

        if (bounds.isValid()) {
            energyMap.fitBounds(bounds,{
                padding:[20,20]
            });
        }

        renderEnergyMap();

        $("map_status").textContent =
            geojson.features.length +
            (lang === "fr"
                ? " gouvernorats chargés."
                : " محافظة تم تحميلها.");

        console.log(
            "GeoJSON chargé :",
            geojson.features.length,
            "gouvernorats"
        );

    } catch(error) {

        console.error("Erreur GeoJSON :",error);

        $("map_status").textContent =
            "Erreur GeoJSON : " + error.message;
    }
}

/* =========================================================
   13. STYLE DES POLYGONES
========================================================= */

function styleGovernorate(feature) {

    /*
       Les statistiques actuelles sont disponibles
       au niveau des six régions, pas des 24 gouvernorats.

       Les polygones restent donc gris lorsqu'il n'existe
       pas de mesure propre au gouvernorat.
    */

    return {
        color:"#ffffff",
        weight:1.5,
        opacity:1,
        fillColor:"#aebbc0",
        fillOpacity:0.45
    };
}

/* =========================================================
   14. POPUPS GOUVERNORATS
========================================================= */

function onEachGovernorate(feature,layer) {

    const name = getGovernorateName(feature);

    layer.on("mouseover",function() {

        layer.setStyle({
            weight:3,
            color:"#12303b",
            fillOpacity:0.75
        });
    });

    layer.on("mouseout",function() {
        governorateLayer.resetStyle(layer);
    });

    layer.on("click",function() {

        const regionId = getRegionId(feature);

        const item = regionId
            ? getRegionData(regionId)
            : null;

        showGovernoratePopup(layer,name,item);
    });
}

function showGovernoratePopup(layer,name,item) {

    let content;

    if (item) {

        const color = getUsageColor(item.u);

        content = `
            <div class="governorate-popup">

                <strong>${escapeMapText(name)}</strong>

                <p>
                    Zone modélisée associée :
                    <b>${escapeMapText(item.r.fr || item.r.id)}</b>
                </p>

                <div class="usage" style="color:${color}">
                    ${formatUsage(item.u)}
                </div>

                <div>
                    Statut :
                    <b>${getUsageStatus(item.u)}</b>
                </div>

                <div>
                    Demande :
                    ${nm(item.mw)} MW
                </div>

                <small>
                    Valeur indicative de la zone associée,
                    pas une mesure propre au gouvernorat.
                </small>

            </div>
        `;

    } else {

        content = `
            <div class="governorate-popup">
                <strong>${escapeMapText(name)}</strong>

                <p>
                    Données énergétiques indisponibles
                    pour ce gouvernorat.
                </p>
            </div>
        `;
    }

    layer.bindPopup(content).openPopup();
}

/* =========================================================
   15. MISE A JOUR DES MARQUEURS
========================================================= */

function renderEnergyMap(cur) {

    if (!window.TunisiaMap) {
        console.error("[ÉnergiTN] TunisiaMap n'est pas chargé.");
        return;
    }

    window.TunisiaMap.render(
        cur,
        sel,
        lang
    );
}
/* =========================================================
   16. CONFIGURATION INTERFACE
========================================================= */

function setup() {

    const x = t();

    document.documentElement.lang = lang;
    document.documentElement.dir =
        lang === "ar" ? "rtl" : "ltr";

    $("lang").textContent =
        lang === "ar" ? "Français" : "العربية";

    $("role").textContent = x.role;

    for (const k of [
        "l_day","h_map","h_rank","h_al",
        "h_heat","h_det","h_an"
    ]) {
        $(k).textContent = x[k];
    }

    $("map_hint").textContent = x.map_hint;

    if (DATES.length) {

        $("day").innerHTML = DATES.map((_,d) => `

            <option value="${d}" ${d===day?"selected":""}>
                J+${d+1} · ${
                    dateOf(d).toLocaleDateString(
                        x.loc,
                        {
                            weekday:"short",
                            day:"numeric",
                            month:"short"
                        }
                    )
                }
            </option>

        `).join("");

    } else {

        $("day").innerHTML = "";

    }

    $("foot").textContent = lang === "fr"
        ? "Prototype académique : demande simulée à partir de la météo et de profils synthétiques, non reliée aux systèmes réels du fournisseur national d’électricité."
        : "نموذج أكاديمي: الطلب محاكى وليس مرتبطا بأنظمة المزوّد الوطني الحقيقية.";

    $("leg").innerHTML = `

        <span><i class="legend-green"></i>${x.ok} &lt; 80 %</span>

        <span><i class="legend-orange"></i>${x.w} 80–92 %</span>

        <span><i class="legend-red"></i>${x.b} ≥ 92 %</span>

        <span>
            <i class="legend-gray"></i>
            ${lang==="fr"?"Données indisponibles":"بيانات غير متوفرة"}
        </span>

    `;

    $("play").textContent = timer ? x.pause : x.play;

    $("play").classList.toggle("on",!!timer);
}

/* =========================================================
   17. RENDU DU TABLEAU DE BORD
========================================================= */

function render() {

    const x = t();

    if (!DATES.length || !R.length) {

        $("kp").innerHTML =
            '<p class="note">Aucune donnée disponible.</p>';

        $("rank").innerHTML =
            '<p class="note">Aucune région disponible.</p>';

        $("al").innerHTML =
            '<p class="note">Aucune alerte disponible.</p>';

        $("hm").innerHTML = "";
        $("det").innerHTML = "";
        $("an").innerHTML = "";

        renderEnergyMap([]);

        return;
    }

    day = Math.max(0,Math.min(day,DATES.length-1));

    $("day").value = String(day);

    $("hour").value = hour;
    $("heat").value = heat;

    $("l_hour").textContent =
        x.l_hour + String(hour).padStart(2,"0") + ":00";

    $("l_heat").textContent =
        x.l_heat + (heat>=0?"+":"") + heat + " °C";

    $("date").textContent =
        dateOf(day).toLocaleDateString(
            x.loc,
            {
                weekday:"long",
                day:"numeric",
                month:"long",
                year:"numeric"
            }
        ) + " · " + String(hour).padStart(2,"0") + ":00";

    // Données des régions

    const cur = R.map(r => {

        const u = util(r,day,hour);
        const capacity = safeNumber(r.cap);

        return {
            r,
            u,
            mw: u !== null && capacity !== null
                ? u * capacity
                : null
        };

    });

    // Indicateurs nationaux

    const valid = cur.filter(c => c.mw !== null);

    const tot = valid.reduce((a,c)=>a+c.mw,0);

    const capT = valid.reduce(
        (a,c)=>a+(safeNumber(c.r.cap) ?? 0),
        0
    );

    const nred = cur.filter(
        c => c.u !== null && c.u >= RED
    ).length;

    let rh = 0;

    R.forEach(r => {

        for(let h=0;h<24;h++) {

            const value = util(r,day,h);

            if(value !== null && value >= RED) {
                rh++;
            }

        }

    });

    $("kp").innerHTML = `

        <div>
            <small>${x.k1}</small>
            <b>${nm(tot)} <small>${x.mw}</small></b>
        </div>

        <div>
            <small>${x.k2}</small>
            <b>${nm(capT-tot)} <small>${x.mw}</small></b>
        </div>

        <div class="${nred?"r":""}">
            <small>${x.k3}</small>
            <b>${nred} / ${R.length}</b>
        </div>

        <div>
            <small>${x.k4}</small>
            <b>${rh} h</b>
        </div>

    `;

    // Carte

    renderEnergyMap(cur);

    // Classement régional

    $("rank").innerHTML = [...cur]
        .sort((a,b)=>(b.u ?? -1)-(a.u ?? -1))
        .map(c=>`

            <button class="row"
                type="button"
                data-r="${escapeMapText(c.r.id)}"
                aria-pressed="${sel===c.r.id}">

                <span>${escapeMapText(c.r[lang] || c.r.fr || c.r.id)}</span>

                <span class="t">
                    <i style="
                        width:${c.u===null?0:Math.min(c.u,1)*100}%;
                        background:${col(c.u)}
                    "></i>
                </span>

                <span class="p" style="color:${col(c.u)}">
                    ${formatUsage(c.u)}
                </span>

            </button>

        `).join("");

    // Alertes

    const al = [...cur]
        .filter(c=>c.u!==null && c.u>=AMB)
        .sort((a,b)=>b.u-a.u);

    $("al").innerHTML = al.length

        ? al.map(c=>`

            <div class="al ${c.u>=RED?"":"w"}">

                <b>${x[st(c.u)]}</b> · ${

                    (c.u>=RED?x.al_b:x.al_w)
                    .replace("%r",escapeMapText(c.r[lang] || c.r.fr))
                    .replace("%p",Math.round(c.u*100))

                }

            </div>

        `).join("")

        : `<p class="note">${x.noal}</p>`;

    // Carte de chaleur

    const cw = 22;
    const ch = 24;
    const lw = 70;

    let h = `
        <svg viewBox="0 0 ${lw+24*cw} ${R.length*ch+22}"
             dir="ltr" role="img">
    `;

    R.forEach((r,i)=>{

        h += `

            <text x="${lw-6}" y="${i*ch+16}"
                font-size="11"
                text-anchor="end"
                fill="var(--ink)"
                font-weight="${sel===r.id?800:400}">
                ${escapeMapText(r[lang] || r.fr || r.id)}
            </text>

        `;

        for(let k=0;k<24;k++){

            const u = util(r,day,k);

            h += `

                <rect
                    data-r="${escapeMapText(r.id)}"
                    x="${lw+k*cw+1}"
                    y="${i*ch+1}"
                    width="${cw-2}"
                    height="${ch-2}"
                    rx="3"
                    fill="${col(u)}"
                    opacity="${u===null?.3:u>=RED?1:u>=AMB?.8:.45}">

                    <title>
                        ${escapeMapText(r[lang] || r.fr || r.id)}
                        ${k}h : ${formatUsage(u)}
                    </title>

                </rect>

            `;
        }
    });

    for(let k=0;k<24;k+=3){

        h += `

            <text x="${lw+k*cw+cw/2}"
                y="${R.length*ch+14}"
                font-size="10"
                text-anchor="middle"
                fill="var(--mute)">
                ${k}h
            </text>

        `;
    }

    h += `

        <rect x="${lw+hour*cw}" y="0"
            width="${cw}" height="${R.length*ch}"
            fill="none"
            stroke="var(--ink)"
            stroke-width="2"
            rx="3"/>

        </svg>
    `;

    $("hm").innerHTML = h;

    // Détail région sélectionnée

    const r = R.find(z=>z.id===sel) || R[0];

    if(!r) {
        $("det").innerHTML = "";
        return;
    }

    sel = r.id;

    const us = SH.map((_,k)=>util(r,day,k));

    const validUs = us.filter(u=>u!==null);

    if (!validUs.length) {
        $("det").innerHTML =
            '<p class="note">Données indisponibles pour cette région.</p>';
    } else {

        const pk = us.reduce(
            (best,value,index) =>
                value !== null &&
                (best === -1 || value > us[best])
                    ? index
                    : best,
            -1
        );

        const over = us.filter(u=>u!==null && u>=RED).length;

        const W = 520;
        const H = 190;
        const p = 34;

        const X = k => p+k*(W-2*p)/23;

        const mx = Math.max(1.1,...validUs)*1.05;

        const Y = u => H-24-(H-40)*(u ?? 0)/mx;

        let d = `

            <svg viewBox="0 0 ${W} ${H}" dir="ltr" role="img">

            <rect x="${p}" y="${Y(mx)}"
                width="${W-2*p}"
                height="${Y(RED)-Y(mx)}"
                fill="var(--bad)"
                opacity=".13"/>

            <line x1="${p}" x2="${W-p}"
                y1="${Y(RED)}" y2="${Y(RED)}"
                stroke="var(--bad)"
                stroke-dasharray="5 4"/>

            <text x="${W-p}" y="${Y(RED)-4}"
                font-size="10"
                text-anchor="end"
                fill="var(--bad)">
                ${x.seuil} 92 %
            </text>

            <line x1="${p}" x2="${W-p}"
                y1="${Y(AMB)}" y2="${Y(AMB)}"
                stroke="var(--warn)"
                stroke-dasharray="3 4"/>

        `;

        const points = us.map((u,k)=>(
            u===null ? null : X(k)+","+Y(u)
        )).filter(Boolean).join(" ");

        d += `

            <polyline fill="none"
                stroke="var(--teal)"
                stroke-width="3"
                points="${points}"/>

        `;

        us.forEach((u,k)=>{

            if(u!==null && u>=RED){

                d += `

                    <circle cx="${X(k)}" cy="${Y(u)}"
                        r="4" fill="var(--bad)"/>

                `;
            }
        });

        d += `

            <line x1="${X(hour)}" x2="${X(hour)}"
                y1="10" y2="${H-24}"
                stroke="var(--ink)"
                stroke-width="1.5"/>

        `;

        for(let k=0;k<24;k+=3){

            d += `

                <text x="${X(k)}" y="${H-8}"
                    font-size="10"
                    text-anchor="middle"
                    fill="var(--mute)">
                    ${k}h
                </text>

            `;
        }

        for(const g of [0,.5,1]){

            d += `

                <text x="2" y="${Y(g)+4}"
                    font-size="10"
                    fill="var(--mute)">
                    ${g*100}%
                </text>

            `;
        }

        const peakValue = us[pk];
        const peakTemp = temp(r,day,hour);

        $("det").innerHTML = `

            <p style="margin:0 0 6px">

                <b>${escapeMapText(r[lang] || r.fr || r.id)}</b>

                · ${x.cap} ${nm(r.cap)} ${x.mw}

                · ${x.temp} ${peakTemp===null?"N/D":Math.round(peakTemp)+" °C"}

                <br>

                ${x.peak} :

                <b style="color:${col(peakValue)}">
                    ${formatUsage(peakValue)}
                </b>

                (${pk}h)

                · <b>${over}</b> ${x.hrs}

            </p>

        ` + d + "</svg>";
    }

    // Anomalies

    const AN = Array.isArray(D.anomalies) ? D.anomalies : [];

    $("an").innerHTML = `

        <table>

            <tr>
                ${x.th.map(a=>`<th>${a}</th>`).join("")}
            </tr>

            ${AN.map(a=>{

                const region = R.find(z=>z.id===a[0]);

                return `

                    <tr>

                        <td>
                            ${escapeMapText(region
                                ? region[lang] || region.fr || region.id
                                : a[0])}
                        </td>

                        <td>
                            <b style="color:${
                                a[1]>=7?"var(--bad)":
                                a[1]>=4?"var(--warn)":
                                "var(--ok)"
                            }">${escapeMapText(a[1])}</b>
                        </td>

                        <td>${escapeMapText(a[2])}</td>

                    </tr>

                `;

            }).join("")}

        </table>

    `;
}

/* =========================================================
   18. INTERACTIONS
========================================================= */

document.addEventListener("click",e=>{

    const row = e.target.closest("[data-r]");

    if(row) {

        sel = row.dataset.r;

        render();

        return;
    }

    if(e.target.closest("#lang")) {

        lang = lang === "fr" ? "ar" : "fr";

        try {
            localStorage.setItem("lang",lang);
        } catch(_) {}

        setup();
        render();

        return;
    }

    if(e.target.closest("#play")) {

        if(timer) {

            clearInterval(timer);
            timer = null;

        } else {

            timer = setInterval(()=>{

                hour = (hour+1)%24;

                $("hour").value = hour;

                render();

            },800);
        }

        setup();
        render();
    }
});

/* =========================================================
   19. CONTROLES
========================================================= */

$("day").addEventListener("change",e=>{

    day = Number(e.target.value);

    render();
});

$("hour").addEventListener("input",e=>{

    hour = Number(e.target.value);

    render();
});

$("heat").addEventListener("input",e=>{

    heat = Number(e.target.value);

    render();
});

/* =========================================================
   20. DEMARRAGE
========================================================= */

/* =========================================================
   20. DEMARRAGE
========================================================= */

document.addEventListener("DOMContentLoaded", function () {

    setup();

    if (window.TunisiaMap) {

        TunisiaMap.init({

            lang: lang,

            onRegionSelect: function (regionId) {

                sel = regionId;

                render();

            }

        });

    } else {

        console.error(
            "[ÉnergiTN] Impossible de charger la carte."
        );

        $("map_status").textContent =
            "Erreur : le module de la carte est indisponible.";

    }

    render();

});
</script>
